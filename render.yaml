# Render Blueprint Specification File for server-tick-netcode
# Refer to AGENTS.md / ops prefix for details.

services:
  # ──────────────────────────────────────────
  # Go Game Service (Authoritative Simulation)
  # ──────────────────────────────────────────
  - type: web
    name: tick-gameserver
    env: docker
    dockerfilePath: service/Dockerfile
    dockerContext: service
    plan: free
    envVars:
      # Bind gRPC port to Render's dynamically allocated HTTP port
      - key: GRPC_PORT
        fromEnvVar: PORT
      - key: ARENA_W
        value: "1200"
      - key: ARENA_H
        value: "800"

  # ──────────────────────────────────────────
  # Java Gateway (WebSocket Relay)
  # ──────────────────────────────────────────
  - type: web
    name: tick-gateway
    env: docker
    dockerfilePath: gateway/Dockerfile
    dockerContext: gateway
    plan: free
    envVars:
      # Bind Gateway port to Render's dynamically allocated HTTP port
      - key: SERVER_PORT
        fromEnvVar: PORT
      # Automatically resolve the Go service host
      - key: GO_SERVICE_HOST
        fromService:
          name: tick-gameserver
          type: web
          property: host
      # Automatically resolve the Go service port
      - key: GO_SERVICE_PORT
        fromService:
          name: tick-gameserver
          type: web
          property: port
