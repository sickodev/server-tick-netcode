# Render Blueprint Specification File for server-tick-netcode
# Refer to AGENTS.md / ops prefix for details.

services:
  # ──────────────────────────────────────────
  # Go Game Service (Authoritative Simulation)
  # ──────────────────────────────────────────
  # type: pserv (private service) is required for gRPC.
  # Render's public "web" proxy speaks HTTP/1.1 only, which breaks gRPC (requires HTTP/2).
  # A private service bypasses the public proxy entirely, allowing raw TCP / HTTP/2 gRPC
  # over Render's internal private network between containers in the same region.
  - type: pserv
    name: tick-gameserver-kalyan
    env: docker
    dockerfilePath: service/Dockerfile
    dockerContext: service
    plan: free
    envVars:
      # Explicitly set the port to 9090 to match EXPOSE 9090 in Dockerfile
      - key: PORT
        value: "9090"
      - key: ARENA_W
        value: "1200"
      - key: ARENA_H
        value: "800"

  # ──────────────────────────────────────────
  # Java Gateway (WebSocket Relay)
  # ──────────────────────────────────────────
  - type: web
    name: tick-gateway-kalyan
    env: docker
    dockerfilePath: gateway/Dockerfile
    dockerContext: gateway
    plan: free
    envVars:
      # Explicitly set the port to 8080 to match EXPOSE 8080 in Dockerfile
      - key: PORT
        value: "8080"
      # Resolve the Go game service internal private-network hostname.
      # Using type: pserv ensures Render returns the internal host (not the public onrender.com URL).
      # The gateway connects over the private network without TLS — gRPC works natively over HTTP/2.
      - key: GO_SERVICE_HOST
        fromService:
          name: tick-gameserver-kalyan
          type: pserv
          property: host
      # gRPC port matching EXPOSE 9090 in the game service Dockerfile
      - key: GO_SERVICE_PORT
        value: "9090"
      # Disable TLS for internal private-network gRPC — the private network is already secure
      # and Render does not terminate/wrap private traffic with TLS.
      - key: GRPC_USE_TLS
        value: "false"
