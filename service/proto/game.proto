syntax = "proto3";

package game;

option go_package = "service/proto/pb";
option java_package = "com.netcode.gateway.proto";
option java_multiple_files = true;

// ============================================================================
// CHANGELOG
// ============================================================================
// 2026-08-25: Initial schema definition (proto#G04)
//   - Added JoinRequest and JoinResponse messages for player connection onboarding.
//   - Added UserCmd message for transmitting client movement, aim, and firing inputs.
//   - Added EntityState and BulletState messages for individual object state replication.
//   - Added Snapshot message for authoritative periodic tick world updates.
//   - Added LeaveRequest message for graceful client disconnect notifications.
//   - Added ClientMessage and ServerMessage wrapper types with oneof payloads.
//   - Added GameService with bidirectional streaming Play RPC.
// ============================================================================

// ----------------------------------------------------------------------------
// Client -> Server Requests
// ----------------------------------------------------------------------------

// JoinRequest is sent once by the client upon connecting to enter the game arena.
message JoinRequest {
  // Unique player identifier assigned by the gateway session or authenticated user token.
  string player_id = 1;

  // Human-readable display name chosen by the player.
  string name = 2;
}

// UserCmd represents a single client input frame captured at input sampling frequency.
// Used by the server to simulate physics and by the client for prediction reconciliation.
message UserCmd {
  // Unique player identifier sending this input command (verified/injected by gateway).
  string player_id = 1;

  // Monotonically increasing sequence number for this player's commands (used for ack reconciliation).
  int32 seq = 2;

  // Client-side timestamp in milliseconds when input was sampled.
  int64 timestamp = 3;

  // Normalized X movement direction (-1.0 for left, 0.0 for none, 1.0 for right).
  float dx = 4;

  // Normalized Y movement direction (-1.0 for up, 0.0 for none, 1.0 for down).
  float dy = 5;

  // Aim direction in radians (angle between player origin and mouse cursor).
  float aim_angle = 6;

  // Flag indicating whether the primary weapon fire action was triggered during this command.
  bool fire = 7;
}

// LeaveRequest is sent when a player gracefully disconnects from the game session.
message LeaveRequest {
  // Unique player identifier of the departing player.
  string player_id = 1;
}

// ----------------------------------------------------------------------------
// Server -> Client Responses & State Broadcasts
// ----------------------------------------------------------------------------

// JoinResponse is sent by the server to acknowledge JoinRequest and provide initial spawn parameters.
message JoinResponse {
  // True if the player was successfully admitted to the match, false if rejected.
  bool ok = 1;

  // Initial spawn position X coordinate in arena pixels.
  float spawn_x = 2;

  // Initial spawn position Y coordinate in arena pixels.
  float spawn_y = 3;
}

// EntityState represents the authoritative state of a single player character in the arena.
message EntityState {
  // Unique identifier for the entity (matches player_id for players).
  string id = 1;

  // Authoritative X position coordinate in arena pixels.
  float x = 2;

  // Authoritative Y position coordinate in arena pixels.
  float y = 3;

  // Current facing/aim direction in radians.
  float angle = 4;

  // Current health points (0 represents eliminated state).
  int32 health = 5;

  // True if this entity represents the receiving client's own avatar (used for prediction reconciliation).
  bool is_self = 6;
}

// BulletState represents an active projectile in flight within the arena.
message BulletState {
  // Unique identifier for the bullet instance.
  string id = 1;

  // Player identifier of the shooter who fired this projectile.
  string owner_id = 2;

  // Current authoritative X position coordinate in arena pixels.
  float x = 3;

  // Current authoritative Y position coordinate in arena pixels.
  float y = 4;

  // Velocity along the X axis in pixels per second.
  float vx = 5;

  // Velocity along the Y axis in pixels per second.
  float vy = 6;
}

// Snapshot carries the authoritative game state at a specific server tick.
// Broadcast to connected clients at the server tick rate (e.g. 64 Hz).
message Snapshot {
  // Monotonically increasing server tick counter at the time of snapshot capture.
  int64 server_tick = 1;

  // Highest UserCmd sequence number from the receiving player that has been processed.
  int32 ack_seq = 2;

  // Complete list of active player entities in the arena during this tick.
  repeated EntityState entities = 3;

  // Complete list of active bullets traveling through the arena during this tick.
  repeated BulletState bullets = 4;
}

// ----------------------------------------------------------------------------
// Stream Envelopes & Service Definition
// ----------------------------------------------------------------------------

// ClientMessage is the top-level envelope for all client-to-server messages over the gRPC stream.
message ClientMessage {
  oneof payload {
    // Initial join request to enter the match.
    JoinRequest join_request = 1;

    // Periodic input command containing movement, aim, and weapon actions.
    UserCmd user_cmd = 2;

    // Graceful disconnect request.
    LeaveRequest leave_request = 3;
  }
}

// ServerMessage is the top-level envelope for all server-to-client messages over the gRPC stream.
message ServerMessage {
  oneof payload {
    // Initial spawn confirmation and initial coordinates.
    JoinResponse join_response = 1;

    // Periodic authoritative world snapshot for rendering and reconciliation.
    Snapshot snapshot = 2;
  }
}

// GameService defines the bidirectional streaming RPC interface between the gateway and Go game service.
service GameService {
  // Play opens a bidirectional streaming connection for an active player session.
  // The gateway streams ClientMessage envelopes (inputs/join/leave) to the Go server,
  // and the Go server streams ServerMessage envelopes (responses/snapshots) back.
  rpc Play(stream ClientMessage) returns (stream ServerMessage);
}
